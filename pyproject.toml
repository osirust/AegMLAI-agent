[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegml-agent"
version = "0.1.0"
description = "Minimal, inspectable preparation scaffold for the AegML hackathon team"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegml = "aegml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
